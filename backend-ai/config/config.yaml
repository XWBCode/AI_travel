app:
  name: ai-travel-ai-service
  version: 0.1.0
  env: local

server:
  host: 0.0.0.0
  port: 8000
  # SSE 场景建议单 worker，避免长连接分配不均；横向扩展交给 Nginx
  workers: 1

# ===== LLM 配置（可插拔）=====
# 所有值都可以被同名环境变量覆盖，优先级：环境变量 > 本文件 > 代码默认值
llm:
  # mock | openai_compatible
  provider: mock
  base_url: https://api.deepseek.com/v1
  model: deepseek-chat
  api_key: ""
  timeout_seconds: 120
  max_tokens: 2048
  temperature: 0.7
  # 计划生成走严格 JSON 模式（response_format）。自建/代理服务不支持时置 false
  json_mode: true

rag:
  enabled: false
