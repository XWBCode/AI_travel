spring:
  datasource:
    url: jdbc:h2:mem:aitravel;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  data:
    redis:
      host: localhost
      port: 6379
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql

app:
  jwt:
    secret: test-secret-key-for-unit-test-only-0123456789abcdef
