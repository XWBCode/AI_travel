name: CI

# 为什么要上 CI（PM 2026-11-23 决策 A 的第一步）：
# 三端测试一直靠人手动跑，跑没跑、跑的是哪一版，全靠自觉。
# 真实模型 20 次复验后连出两个「改 A 忘 B」的缺陷（提示词漏写校验器规则、SSE 上限短于 AI 超时），
# 都是「本地跑过就以为没问题」的典型。门禁交给机器，才有资格谈进 M3。
#
# 注意：本流水线不跑真实模型。原因有两条——密钥不进 CI，模型调用有成本且不可重复。
# 真实模型复验是发布前的人工动作，见 docs/ops/LLM-接入与切换.md。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java 编译 + 单测
    runs-on: ubuntu-latest
    services:
      # 集成测试连真 MySQL，不用 H2：建表脚本用了 JSON 列、ON UPDATE CURRENT_TIMESTAMP、
      # InnoDB 等 MySQL 专有特性，H2 的兼容模式会把差异掩盖成「测试通过、生产报错」。
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ai_travel_test
          MYSQL_USER: ai_travel
          MYSQL_PASSWORD: ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: mvn test
        working-directory: backend-java
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: ai_travel
          MYSQL_PASSWORD: ci_password
        run: mvn -B -q test
      - name: 保存测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend-java/target/surefire-reports/
          retention-days: 7

  python:
    name: Python 单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend-ai/requirements.txt
            backend-ai/requirements-dev.txt
      - name: 安装依赖
        working-directory: backend-ai
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest
        working-directory: backend-ai
        # 这些用例不连库、不调模型：契约校验、意图解析、截断分型、SSE 解析都是纯函数。
        # 一旦有人不小心让单测依赖外部服务，这里会立刻变红——这是特性，不是麻烦。
        run: python -m pytest -q

  frontend:
    name: 前端类型检查 + 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        # 用 npm ci 而不是 npm install：锁文件才是「跑的是哪一版」的凭据。
        # 2026-11-23 补了 package-lock.json，并本地用 npm ci 重装后跑过 193 条断言。
        run: npm ci --no-audit --no-fund
      - name: 类型检查
        working-directory: frontend
        run: npx vue-tsc --noEmit
      - name: 单元测试
        working-directory: frontend
        run: npm test
