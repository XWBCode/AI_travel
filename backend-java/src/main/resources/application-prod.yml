# ============================================================
# prod：正式运行
# 原则：所有敏感项与环境地址一律从环境变量注入，不提供任何默认值，
#       缺失即启动失败（fail fast），避免误用开发配置上线。
# 数据库：独立实例与独立 schema，不得与 dev/test 共用（06 文档 §1 U 条）
# 模型：仅真实数据源，禁止 mock
# ============================================================
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DB}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true&requireSSL=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0
      timeout: 3000ms

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ORIGINS}
  ai:
    base-url: ${AI_SERVICE_URL}
    read-timeout-ms: ${AI_READ_TIMEOUT_MS:300000}
    plan-timeout-ms: ${AI_PLAN_TIMEOUT_MS:300000}
    adjust-timeout-ms: ${AI_ADJUST_TIMEOUT_MS:180000}
    # 并发上限：8 并发实测 P50 132.7s（串行 127.4s），再往上会被队列吸收成长尾；
    # 队列封顶后超出的请求立刻 10429，而不是静默排队
    stream-pool-size: ${AI_STREAM_POOL_SIZE:8}
    stream-queue-capacity: ${AI_STREAM_QUEUE_CAPACITY:0}

logging:
  level:
    com.aitravel: info
