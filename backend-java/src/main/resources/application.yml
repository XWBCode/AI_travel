spring:
  application:
    name: ai-travel-backend
  profiles:
    active: local
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:ai_travel}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    # 生产环境必须通过环境变量覆盖，禁止使用默认值上线
    secret: ${JWT_SECRET:ai-travel-dev-secret-please-change-me-in-production-0123456789}
    access-token-minutes: 120
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout-ms: 5000
    read-timeout-ms: 180000

logging:
  level:
    root: info
    com.aitravel: debug
