version: "3.8"

# 可选：仅用于快速起 MySQL/Redis，不打包应用本身
# 用法：docker compose up -d
services:
  mysql:
    image: mysql:8.0
    container_name: ai-travel-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      # dev 专库 + 专用账号，与 06 文档环境隔离要求一致
      MYSQL_DATABASE: ${MYSQL_DB:-ai_travel_dev}
      MYSQL_USER: ${MYSQL_USER:-ai_travel}
      # 口令由 .env 注入；占位默认值仅用于本机起容器，禁止用于任何共享环境
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ai_travel_dev_change_me}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci

  redis:
    image: redis:7-alpine
    container_name: ai-travel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
