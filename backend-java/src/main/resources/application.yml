# ============================================================
# 公共配置：只放与环境无关的项与结构定义
# 环境特定值（数据库连接、密钥、外部服务地址）见
#   application-dev.yml  /  application-prod.yml
# 规范：docs/design/06-工程环境与发布规范.md 第 1 节
# ============================================================
spring:
  application:
    name: ai-travel-backend
  profiles:
    # 默认 dev；生产必须显式指定 SPRING_PROFILES_ACTIVE=prod
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  # 迁移脚本唯一来源：仓库根 sql/migration（pom 中复制到 classpath:db/migration）
  # 启动时自动执行，结果写入 flyway_schema_history；禁止跳过版本手工改表
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: true
    clean-disabled: true
    # Phase 1 的库是手工建表的，没有历史表。以 version 0 建立基线，
    # 之后 V1（CREATE TABLE IF NOT EXISTS）在已有库上空操作、在空库上建基础表，V2 建计划表。
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    access-token-minutes: 120
  ai:
    connect-timeout-ms: 5000
    read-timeout-ms: 180000

logging:
  level:
    root: info
