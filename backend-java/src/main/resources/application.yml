# ============================================================
# 公共配置：只放与环境无关的项与结构定义
# 环境特定值（数据库连接、密钥、外部服务地址）见
#   application-dev.yml  /  application-prod.yml
# 规范：docs/design/06-工程环境与发布规范.md 第 1 节
# ============================================================
spring:
  application:
    name: ai-travel-backend
  profiles:
    # 默认 dev；生产必须显式指定 SPRING_PROFILES_ACTIVE=prod
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  # 迁移脚本唯一来源：仓库根 sql/migration（pom 中复制到 classpath:db/migration）
  # 启动时自动执行，结果写入 flyway_schema_history；禁止跳过版本手工改表
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: true
    clean-disabled: true
    # Phase 1 的库是手工建表的，没有历史表。以 version 0 建立基线，
    # 之后 V1（CREATE TABLE IF NOT EXISTS）在已有库上空操作、在空库上建基础表，V2 建计划表。
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    access-token-minutes: 120
  ai:
    connect-timeout-ms: 5000
    # 与 dev/prod 保持一致：交融网关 7 天行程实测 160–210s，180s 会误杀长尾（BUG-013）
    read-timeout-ms: 300000
    plan-timeout-ms: 300000
    adjust-timeout-ms: 180000
    # 并行度与排队上限：详见 AiStreamConfig 的注释与可靠性报告 §5
    stream-pool-size: 8
    stream-queue-capacity: 0
    # 天气查询上限（M3-1）：页面附属信息，慢到 5s 就该降级，不复用 300s 的流式读超时
    weather-timeout-ms: 5000
    # 灰度身份签名密钥（M3-3 · S5）：Java 用它给 X-User-Id 签 HMAC，Python 用同一个值验签。
    # 空 = 不发身份头 = 灰度不生效。生产务必与 Python 的 AI_INTERNAL_SECRET 同值。
    internal-secret: ${AI_INTERNAL_SECRET:}
  weather:
    # none | qweather | open-meteo。默认 none 是刻意的，不是「还没配」：
    # 天气是外部依赖，没显式打开就不能默默调上游（W-8 合规 + 别把可用性交给别人）。
    # D-03 已定案商用源为和风天气：WEATHER_PROVIDER=qweather
    provider: ${WEATHER_PROVIDER:none}
    timeout-ms: ${WEATHER_TIMEOUT_MS:5000}
    # 与 Python 侧 cache_ttl_minutes 必须同值。原来这里是 30，会覆盖 WeatherProperties
    # 的字段默认值 60（Spring 绑定优先级：配置文件 > 字段默认值），结果 Java 按 30 分钟
    # 判过期、Python 按 60 分钟给 expiresAt，两套时钟打架。D-03 定 60，这里跟上。
    cache-ttl-minutes: ${WEATHER_CACHE_TTL_MINUTES:60}
    cache-max-entries: 1000

logging:
  level:
    root: info
