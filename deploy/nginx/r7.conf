# R7 最小反代环境（只为验证「SSE 长连接在反代后面能不能活」）
#
# 这不是生产配置。它只做一件事：把 /api/ 原样转给本机 8080，
# 并保持 SSE 需要的三件事——不缓冲、不缓存、长连接。
#
# 用法（Windows，nginx 解压到 .tools/nginx-1.26.2）：
#   .tools/nginx-1.26.2/nginx.exe -p .tools/nginx-1.26.2 -c <绝对路径>/deploy/nginx/r7.conf
#   前端不动代码：VITE_PROXY_TARGET=http://127.0.0.1:8088 npm run dev
#
# 关键取舍：proxy_read_timeout 保持默认 60s，**故意不调大**。
# 把超时改到 600s 再发心跳，等于自证「连接能活着」，但永远证明不了心跳有用。
# 保留 60s，对照组（关心跳）必须死在 60s，实验组（开心跳）必须活到 170s+，因果才成立。
# 生产上线时应按最长的 AI 等待给足（见 06 文档），那是另一个问题。

worker_processes 1;
error_log logs/r7-error.log warn;
pid logs/r7.pid;

events {
    worker_connections 256;
}

http {
    access_log logs/r7-access.log;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 75s;

    server {
        listen 8088;
        server_name localhost;

        # 探活：确认 nginx 自己在跑，与后端无关
        location = /r7-health {
            add_header Content-Type text/plain;
            return 200 "r7-nginx-ok";
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8080;

            # 长连接：HTTP/1.1 + 清空 Connection，否则 nginx 会回 close，
            # SSE 会被降级成「一次性响应」，心跳也救不回来
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # SSE 三件套：不缓冲、不缓存、不改写分块
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            # 60s 是 nginx 默认值，这里显式写出来是为了让「对照组会死在哪一秒」可预期
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_connect_timeout 5s;
        }
    }
}
